<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" type="x-icon" href="https://scontent.fceb1-2.fna.fbcdn.net/v/t1.15752-9/400164724_324827416922877_1703190077317486316_n.png?_nc_cat=109&ccb=1-7&_nc_sid=8cd0a2&_nc_eui2=AeE4o2zjVCvugiVO06QpdViuNpVlw2RRT502lWXDZFFPnQwleJujLxRHxacKpj4aZ6QyUqLLSJt8M7IYFQiHz1VR&_nc_ohc=S88OnZYw8U4AX_2080W&_nc_ht=scontent.fceb1-2.fna&oh=03_AdQYRGnJz0KBEMsGJAW-LHQ9Sg78c8fs3kVQQJYDGZDm_w&oe=6581A9B7">
    <title>Income Tax Calculator</title>
    <link rel="stylesheet" href="IncomeTax.css">
</head>
<body>

<div id="calculator">
    <div id="header">
       
        <h2> <mark class="title">Income Tax</mark></h2>
    </div>
    <div id="content">
        <form id="incomeTaxForm">
            <label for="income">Taxable Income:</label>
            <input type="number" id="income" name="income" required>
            <button class="back-button" onclick="window.location.href='index.html'">&#8249;</button>
            <button type="button" onclick="calculateIncomeTax()">Calculate Income Tax</button>
        </form>
        
        <div id="result"></div>
    </div>
</div>
<script>
    function calculateIncomeTax() {
        var income = parseFloat(document.getElementById("income").value);
        var tax = 0;
        if (income <= 250000) {
            tax = 0;
        } else if (income <= 400000) {
            tax = (income - 250000) * 0.2;
        } else if (income <= 800000) {
            tax = ((income - 400000) * 0.25) + 30000;
        } else if (income <= 2000000) {
            tax = ((income - 800000) * 0.3) + 130000;
        } else if (income <= 8000000) {
            tax = ((income - 2000000) * 0.32) + 490000;
        } else {
            tax = ((income - 8000000) * 0.35) + 2410000;
        }

        if (isNaN(income)) {
            document.getElementById("result").innerHTML = "Please enter a valid income.";
        } else {
        document.getElementById("result").innerHTML = "Income Tax: Php " + tax.toFixed(2);
    }}
</script>
</body>
</html>
