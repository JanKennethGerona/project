 <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" type="x-icon" href="https://scontent.fceb1-2.fna.fbcdn.net/v/t1.15752-9/400164724_324827416922877_1703190077317486316_n.png?_nc_cat=109&ccb=1-7&_nc_sid=8cd0a2&_nc_eui2=AeE4o2zjVCvugiVO06QpdViuNpVlw2RRT502lWXDZFFPnQwleJujLxRHxacKpj4aZ6QyUqLLSJt8M7IYFQiHz1VR&_nc_ohc=S88OnZYw8U4AX_2080W&_nc_ht=scontent.fceb1-2.fna&oh=03_AdQYRGnJz0KBEMsGJAW-LHQ9Sg78c8fs3kVQQJYDGZDm_w&oe=6581A9B7">
    <title>Meters to Feet Converter</title>
    <link rel="stylesheet" href="Conversions.css">
</head>
<body>

<div id="converter">
    <h2>Meters to Feet</h2>
    <form id="conversionForm">
        <label for="meters">Meters:</label>
        <input type="number" id="meters" name="meters" required>

        <button type="button" onclick="convertToFeet()">Convert to Feet</button>
    </form>

    <button class="back-button" onclick="window.location.href='../ConversionPage.html'">&#8249;</button>

    <div id="result"></div>
</div>

<script>
    function convertToFeet() {
        var meters = parseFloat(document.getElementById("meters").value);
        var feet = meters * 3.28084;

        if (isNaN(meters)) {
            document.getElementById("result").innerHTML = "Please enter a valid number.";
        } else {
            document.getElementById("result").innerHTML = "" + feet.toFixed(2) + " feet";
        }
    }
</script>

</body>
</html>
